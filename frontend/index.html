<!DOCTYPE html>
<html>
<head>
<title>ANR Lab Mendi Recorder v5</title>
<link rel="stylesheet" href="css/style.css">
</head>

<body>

<h1>🧠 ANR Lab Mendi Recorder v5</h1>
<p>African Neurodata Research Lab</p>

<div class="controls">
<button id="connectBtn">Connect Mendi</button>
<button id="startBtn">Start Recording</button>
<button id="stopBtn">Stop</button>
<button id="exportBtn">Export Session</button>
</div>

<div class="panel">
<h2>Device Status</h2>
<p id="status">Disconnected</p>
</div>

<div class="panel">
<h2>Live Signal Monitor</h2>
<canvas id="signalCanvas" width="700" height="200"></canvas>
</div>

<div class="panel">
<h2>Recording</h2>
<p>Packets: <span id="packetCount">0</span></p>
<p>Duration: <span id="duration">0</span></p>
</div>

<div class="panel">
<h2>Markers</h2>
<div id="markers"></div>
</div>

<script type="module" src="js/app.js"></script>

</body>
</html>
