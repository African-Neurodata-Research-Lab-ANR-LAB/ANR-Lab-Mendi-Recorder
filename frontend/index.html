<!DOCTYPE html>
<html>
<head>
<title>ANR Lab Mendi Recorder</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<h1>ANR Lab Mendi Recorder</h1>
<p>African Neurodata Research Lab</p>

<button>Connect Mendi</button>
<button>Start Recording</button>
<button>Stop</button>
<button>Export Session ZIP</button>

<h2>Device</h2>
<p id="deviceStatus">Disconnected</p>

<h2>Monitoring</h2>
<p>Packets: <span id="packetCount">0</span></p>
<p>Temperature: <span id="temperature">--</span></p>

<h2>Auto Markers</h2>
<div id="markers"></div>

</body>
</html>
